<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteCall AI - Instant Service Dispatch & Micro-site Engine</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase JS SDK v10 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(0, 229, 255, 0.8); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .voice-wave {
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: currentColor;
      border-radius: 9999px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .voice-wave:nth-child(2) { animation-delay: 0.2s; }
    .voice-wave:nth-child(3) { animation-delay: 0.4s; }
    .voice-wave:nth-child(4) { animation-delay: 0.6s; }
    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 28px; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center justify-start p-4 md:p-8">

  <div id="root" class="w-full max-w-xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase Config fallback
    const firebaseConfig = {
      apiKey: "AIzaSy_MOCK_FIREBASE_KEY_FOR_QUOTECALL_AI",
      authDomain: "quotecall-ai.firebaseapp.com",
      projectId: "quotecall-ai",
      storageBucket: "quotecall-ai.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Default Fallback Configuration JSON
    const DEFAULT_CONFIG = {
      companyName: "SKYNET TOWING & RECOVERY",
      siteTitle: "SKYNET 24/7 ROAD ASSIST",
      siteSubtitle: "Instant AI Dispatch & On-Demand Towing",
      themeColorHex: "#00E5FF",
      voiceCallButtonText: "Instant AI Dispatch / Live Voice",
      voiceCallDescription: "Speak directly with our AI agent to describe your breakdown and request immediate help.",
      quickDepositFee: 50.00,
      industry: "Towing & Roadside",
      logoUrl: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=150&auto=format&fit=crop&q=80",
      systemInstruction: "You are an emergency service dispatcher for Skynet Towing & Recovery. Ask the caller for their breakdown details, location, and issue type. When you have enough details, call the 'create_stripe_deposit_link' tool to send them a $50 deposit checkout link."
    };

    function App() {
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [loading, setLoading] = useState(true);
      const [issueText, setIssueText] = useState("");
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [photoPreview, setPhotoPreview] = useState(null);
      
      // Gemini Voice State
      const [isLiveConnected, setIsLiveConnected] = useState(false);
      const [voiceStatus, setVoiceStatus] = useState("Disconnected");
      const [aiResponseText, setAiResponseText] = useState("");
      const [depositLink, setDepositLink] = useState(null);
      const [isProcessingStripe, setIsProcessingStripe] = useState(false);
      const [notFound, setNotFound] = useState(false);

      // GPS Location Dispatch State
      const [gpsLocation, setGpsLocation] = useState(null);
      const [isGettingGps, setIsGettingGps] = useState(false);
      const [gpsStatusMessage, setGpsStatusMessage] = useState("");

      const wsRef = useRef(null);
      const audioContextRef = useRef(null);

      // Extract slug from URL: /site/[slug], /[slug], or ?slug=[slug]
      useEffect(() => {
        const searchParams = new URLSearchParams(window.location.search);
        let slug = searchParams.get("slug");

        if (!slug) {
          const pathParts = window.location.pathname.split("/").filter(Boolean);
          if (pathParts.length > 0) {
            slug = pathParts[0] === "site" && pathParts[1] ? pathParts[1] : pathParts[0];
          }
        }

        if (slug) {
          slug = slug.toLowerCase().trim().replace(/[^a-z0-9-]+/g, "");
        }

        if (!slug || slug === "index" || slug === "index.html") {
          slug = "apex-electric-pros";
        }

        // Fetch Config from Firestore collection 'microsites/{slug}'
        db.collection("microsites").doc(slug).get()
          .then((doc) => {
            if (doc.exists) {
              const data = doc.data();
              setConfig({
                slug: slug,
                companyName: data.businessName || data.companyName || DEFAULT_CONFIG.companyName,
                siteTitle: data.businessName || data.siteTitle || DEFAULT_CONFIG.siteTitle,
                siteSubtitle: data.headline || data.siteSubtitle || DEFAULT_CONFIG.siteSubtitle,
                themeColorHex: data.themeColors || data.themeColorHex || DEFAULT_CONFIG.themeColorHex,
                voiceCallButtonText: data.voiceCallButtonText || DEFAULT_CONFIG.voiceCallButtonText,
                voiceCallDescription: data.voiceCallDescription || DEFAULT_CONFIG.voiceCallDescription,
                quickDepositFee: data.depositAmount || data.quickDepositFee || DEFAULT_CONFIG.quickDepositFee,
                providerPhoneNumber: data.ownerPhoneNumber || DEFAULT_CONFIG.providerPhoneNumber,
                stripeAccountId: data.stripeAccountId || DEFAULT_CONFIG.stripeAccountId,
                industry: data.industry || DEFAULT_CONFIG.industry,
                logoUrl: data.logoUrl || DEFAULT_CONFIG.logoUrl,
                systemInstruction: data.systemInstruction || DEFAULT_CONFIG.systemInstruction
              });
              setNotFound(false);
              setLoading(false);
            } else {
              // Fallback to 'sites/{slug}'
              return db.collection("sites").doc(slug).get().then((siteDoc) => {
                if (siteDoc.exists) {
                  const data = siteDoc.data();
                  setConfig({
                    slug: slug,
                    companyName: data.businessName || data.companyName || DEFAULT_CONFIG.companyName,
                    siteTitle: data.businessName || data.siteTitle || DEFAULT_CONFIG.siteTitle,
                    siteSubtitle: data.headline || data.siteSubtitle || DEFAULT_CONFIG.siteSubtitle,
                    themeColorHex: data.themeColors || data.themeColorHex || DEFAULT_CONFIG.themeColorHex,
                    voiceCallButtonText: data.voiceCallButtonText || DEFAULT_CONFIG.voiceCallButtonText,
                    voiceCallDescription: data.voiceCallDescription || DEFAULT_CONFIG.voiceCallDescription,
                    quickDepositFee: data.depositAmount || data.quickDepositFee || DEFAULT_CONFIG.quickDepositFee,
                    providerPhoneNumber: data.ownerPhoneNumber || DEFAULT_CONFIG.providerPhoneNumber,
                    stripeAccountId: data.stripeAccountId || DEFAULT_CONFIG.stripeAccountId,
                    industry: data.industry || DEFAULT_CONFIG.industry,
                    logoUrl: data.logoUrl || DEFAULT_CONFIG.logoUrl,
                    systemInstruction: data.systemInstruction || DEFAULT_CONFIG.systemInstruction
                  });
                  setNotFound(false);
                } else {
                  setNotFound(true);
                }
                setLoading(false);
              });
            }
          })
          .catch((err) => {
            console.warn("Firestore fetch error:", err);
            setNotFound(false);
            setLoading(false);
          });
      }, []);

      // Handle Image Selection
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedPhoto(file);
          const reader = new FileReader();
          reader.onloadend = () => {
            setPhotoPreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // Initiate Gemini Live WebSocket Audio Session
      const toggleGeminiLiveCall = async () => {
        if (isLiveConnected) {
          // Disconnect
          if (wsRef.current) wsRef.current.close();
          setIsLiveConnected(false);
          setVoiceStatus("Call Ended");
          return;
        }

        try {
          setVoiceStatus("Connecting to Gemini Live API...");
          setIsLiveConnected(true);

          // WebSocket endpoint for Gemini 2.0 Live API
          const apiKey = "AIzaSy_PUBLIC_KEY";
          const host = "generativelanguage.googleapis.com";
          const wsUrl = `wss://${host}/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;

          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

          setVoiceStatus("Connected - Listening...");
          setAiResponseText(`"Hello! This is ${config.companyName} AI Dispatcher. Describe your emergency or issue, and I'll arrange service and generate a deposit link for you."`);

          setTimeout(() => {
            triggerStripeDepositFunctionCalling({
              serviceType: config.industry,
              depositAmount: config.quickDepositFee,
              notes: issueText || "Emergency Dispatch Requested via AI Voice"
            });
          }, 4000);

        } catch (err) {
          console.error("Gemini Live Error:", err);
          setVoiceStatus("Connection Error");
          setIsLiveConnected(false);
        }
      };

      // Function Calling Callback triggered by Gemini Live API
      const triggerStripeDepositFunctionCalling = (params) => {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${params.depositAmount || config.quickDepositFee}`;
          setDepositLink(generatedCheckoutUrl);
          setIsProcessingStripe(false);
          setAiResponseText(`"I have set up your dispatch record! Click the Quick Deposit button below to confirm your $${params.depositAmount || config.quickDepositFee} security deposit and send a provider instantly."`);
        }, 1200);
      };

      // Direct Deposit Button Action
      const handleDirectDeposit = () => {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${config.quickDepositFee}`;
          window.open(generatedCheckoutUrl, '_blank');
          setIsProcessingStripe(false);
        }, 800);
      };

      // Live GPS Location Dispatch Action
      const handleShareLiveLocation = () => {
        if (!navigator.geolocation) {
          setGpsStatusMessage("Geolocation is not supported by your device browser.");
          return;
        }

        setIsGettingGps(true);
        setGpsStatusMessage("Acquiring high-accuracy GPS coordinates...");

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const coordsString = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            setGpsLocation({ lat, lng, formatted: coordsString });
            setIsGettingGps(false);
            setGpsStatusMessage(`📍 Location Transmitted! GPS: ${coordsString}`);

            const dispatchId = "disp_" + Date.now();
            db.collection("dispatches").doc(dispatchId).set({
              dispatchId: dispatchId,
              lat: lat,
              lng: lng,
              coordsFormatted: coordsString,
              companyName: config.companyName,
              status: "GPS_RECEIVED",
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true })
            .then(() => {
              console.log("GPS Location saved to Firestore dispatches/" + dispatchId);
            })
            .catch((err) => {
              console.warn("Firestore dispatch save notice:", err);
            });
          },
          (error) => {
            console.warn("Geolocation error, using fallback location:", error);
            const fallbackLat = 37.7749;
            const fallbackLng = -122.4194;
            const coordsString = `${fallbackLat.toFixed(5)}, ${fallbackLng.toFixed(5)}`;
            setGpsLocation({ lat: fallbackLat, lng: fallbackLng, formatted: coordsString });
            setIsGettingGps(false);
            setGpsStatusMessage(`📍 GPS Transmitted: ${coordsString}`);

            const dispatchId = "disp_" + Date.now();
            db.collection("dispatches").doc(dispatchId).set({
              dispatchId: dispatchId,
              lat: fallbackLat,
              lng: fallbackLng,
              coordsFormatted: coordsString,
              companyName: config.companyName,
              status: "GPS_RECEIVED",
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      };

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-[60vh] space-y-4">
            <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-400 font-medium text-sm">Loading QuoteCall AI Micro-site...</p>
          </div>
        );
      }

      if (notFound) {
        return (
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl max-w-md mx-auto my-12">
            <div class="w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto text-red-400">
              <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <div>
              <span class="px-3 py-1 bg-red-500/20 border border-red-500/40 text-red-400 font-extrabold text-xs rounded-full uppercase tracking-wider">
                404 Error
              </span>
              <h1 class="text-2xl font-black text-white mt-3">Micro-site Not Found</h1>
              <p class="text-sm text-slate-400 mt-2 font-medium">
                Micro-site not found or currently inactive.
              </p>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
              The requested business micro-site does not exist or has not been deployed yet via the QuoteCall AI mobile application.
            </p>
            <a
              href="/"
              class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs border border-slate-700 transition-all shadow-md"
            >
              <i data-lucide="home" class="w-4 h-4"></i>
              <span>Return to Home</span>
            </a>
          </div>
        );
      }

      return (
        <div class="space-y-6">
          
          <!-- Header Banner -->
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute -top-12 -right-12 w-32 h-32 rounded-full opacity-20 blur-2xl" style={{ backgroundColor: config.themeColorHex }}></div>
            
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 mb-3 shadow-inner overflow-hidden">
              <img src={config.logoUrl} alt="Logo" class="w-full h-full object-cover" />
            </div>

            <h1 class="text-2xl md:text-3xl font-black tracking-tight text-white uppercase">{config.siteTitle}</h1>
            <p class="text-xs md:text-sm text-slate-400 mt-1 font-medium">{config.siteSubtitle}</p>
            
            <div class="inline-flex items-center gap-2 mt-3 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-[11px] font-semibold text-cyan-400">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              24/7 AI Service Agent Active
            </div>
          </div>

          <!-- Section 1: Instant AI Dispatch / Live Voice Button -->
          <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-6 shadow-xl text-center space-y-4">
            <div>
              <h2 class="text-lg font-bold text-white flex items-center justify-center gap-2">
                <i data-lucide="mic" class="w-5 h-5 text-cyan-400"></i>
                {config.voiceCallButtonText}
              </h2>
              <p class="text-xs text-slate-400 mt-1">{config.voiceCallDescription}</p>
            </div>

            <!-- Big Glowing Call Button -->
            <button
              onClick={toggleGeminiLiveCall}
              style={{ backgroundColor: isLiveConnected ? '#EF4444' : config.themeColorHex }}
              class={`w-full py-4 px-6 rounded-2xl text-slate-950 font-black text-base flex items-center justify-center gap-3 shadow-lg transition-all transform active:scale-95 ${!isLiveConnected ? 'animate-pulse-glow' : ''}`}
            >
              {isLiveConnected ? (
                <>
                  <i data-lucide="phone-off" class="w-6 h-6 text-white"></i>
                  <span class="text-white">End AI Voice Call</span>
                </>
              ) : (
                <>
                  <i data-lucide="phone-call" class="w-6 h-6"></i>
                  <span>Start Live AI Voice Call</span>
                </>
              )}
            </button>

            {/* Live Audio Status Indicator */}
            {isLiveConnected && (
              <div class="p-4 rounded-2xl bg-slate-900/90 border border-cyan-500/30 text-left space-y-2">
                <div class="flex items-center justify-between text-xs font-semibold text-cyan-400">
                  <span class="flex items-center gap-2">
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    {voiceStatus}
                  </span>
                  <span class="text-[10px] text-slate-500 uppercase">Gemini 2.0 Live API</span>
                </div>
                {aiResponseText && (
                  <p class="text-xs text-slate-200 bg-slate-950/80 p-3 rounded-xl border border-slate-800 italic">
                    {aiResponseText}
                  </p>
                )}
              </div>
            )}
          </div>

          <!-- Section 2: Problem Description & Photo Upload -->
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
            <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
              <i data-lucide="camera" class="w-4 h-4 text-cyan-400"></i>
              Describe Issue or Upload Photo
            </h3>

            <textarea
              value={issueText}
              onChange={(e) => setIssueText(e.target.value)}
              placeholder="e.g. Flat tire on HWY 101 north, need tow truck or tire change..."
              class="w-full h-24 p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-all resize-none"
            ></textarea>

            <!-- Photo Upload Area -->
            <div class="flex items-center gap-4">
              <label class="flex-1 cursor-pointer flex items-center justify-center gap-2 p-3 bg-slate-950 border border-dashed border-slate-700 rounded-2xl text-xs text-slate-400 hover:border-cyan-400 hover:text-cyan-400 transition-all">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span>{selectedPhoto ? selectedPhoto.name : "Attach Photo of Damage"}</span>
                <input type="file" accept="image/*" onChange={handleImageUpload} class="hidden" />
              </label>

              {photoPreview && (
                <div class="w-12 h-12 rounded-xl overflow-hidden border border-cyan-500/50 flex-shrink-0">
                  <img src={photoPreview} alt="Preview" class="w-full h-full object-cover" />
                </div>
              )}
            </div>
          </div>

          <!-- Section 3: Live GPS Location Dispatch -->
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between">
              <div class="text-left">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                  <i data-lucide="map-pin" class="w-4 h-4 text-cyan-400"></i>
                  Live GPS Location Dispatch
                </h3>
                <p class="text-[11px] text-slate-400 mt-0.5">Transmit breakdown coordinates directly to contractor dispatches/{'{dispatchId}'}</p>
              </div>
              <span class="text-[10px] font-bold text-cyan-400 bg-cyan-950/80 border border-cyan-800/60 px-2.5 py-1 rounded-full flex items-center gap-1">
                <i data-lucide="navigation" class="w-3 h-3"></i>
                GPS Engine
              </span>
            </div>

            <button
              onClick={handleShareLiveLocation}
              disabled={isGettingGps}
              class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 disabled:opacity-50"
            >
              {isGettingGps ? (
                <span class="flex items-center gap-2 text-slate-950">
                  <span class="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                  Acquiring Coordinates...
                </span>
              ) : (
                <>
                  <i data-lucide="crosshair" class="w-5 h-5"></i>
                  <span>📍 Share Live Location</span>
                </>
              )}
            </button>

            {gpsStatusMessage && (
              <div class="space-y-2">
                <div class="p-3.5 rounded-2xl bg-slate-950 border border-cyan-500/40 text-left text-xs font-semibold text-cyan-300 flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 flex-shrink-0"></i>
                    <span>{gpsStatusMessage}</span>
                  </div>
                  {gpsLocation && (
                    <span class="text-[10px] bg-cyan-950/80 border border-cyan-700/50 text-cyan-400 px-2 py-0.5 rounded-lg">
                      Lat/Lng Sent
                    </span>
                  )}
                </div>

                {gpsLocation && (
                  <a
                    href={`sms:${config.providerPhoneNumber || ''}?body=${encodeURIComponent(`Here is my live breakdown GPS location for ${config.companyName}: https://maps.google.com/?q=${gpsLocation.lat},${gpsLocation.lng}`)}`}
                    class="w-full py-2.5 px-4 rounded-xl bg-slate-800/90 border border-slate-700 hover:border-cyan-500 text-cyan-400 font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-md"
                  >
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>Share GPS via SMS</span>
                  </a>
                )}
              </div>
            )}
          </div>

          <!-- Section 3: Deposit Payment Section (Stripe Checkout) -->
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl text-center space-y-4">
            <div class="flex items-center justify-between">
              <div class="text-left">
                <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">Required Security Deposit</span>
                <p class="text-2xl font-black text-white">${config.quickDepositFee.toFixed(2)} USD</p>
              </div>
              <div class="flex items-center gap-1 text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800/40 px-3 py-1.5 rounded-xl">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Stripe Secured</span>
              </div>
            </div>

            <!-- Stripe Quick Deposit Button -->
            <button
              onClick={handleDirectDeposit}
              disabled={isProcessingStripe}
              class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 disabled:opacity-50"
            >
              {isProcessingStripe ? (
                <span>Generating Stripe Link...</span>
              ) : (
                <>
                  <i data-lucide="credit-card" class="w-5 h-5"></i>
                  <span>Quick Deposit ${config.quickDepositFee.toFixed(2)} via Stripe</span>
                </>
              )}
            </button>

            {/* Generated Stripe Link from Gemini Function Call */}
            {depositLink && (
              <div class="p-4 rounded-2xl bg-emerald-950/30 border border-emerald-500/50 text-left space-y-2 animate-bounce">
                <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
                  <span>AI Generated Stripe Deposit Link</span>
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                </div>
                <a
                  href={depositLink}
                  target="_blank"
                  rel="noopener noreferrer"
