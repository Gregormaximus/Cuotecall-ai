<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteCall AI - Hybrid Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { glass: 'rgba(255, 255, 255, 0.05)' } } } }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); } 50% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.8); } }
    .animate-pulse-glow { animation: pulse-glow 2s infinite; }
    .voice-wave { display: inline-block; width: 4px; height: 16px; background-color: currentColor; border-radius: 9999px; animation: wave 1.2s ease-in-out infinite; }
    .voice-wave:nth-child(2) { animation-delay: 0.2s; } .voice-wave:nth-child(3) { animation-delay: 0.4s; } .voice-wave:nth-child(4) { animation-delay: 0.6s; }
    @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 28px; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div id="root" class="w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSy_MOCK_FIREBASE_KEY_FOR_QUOTECALL_AI",
      authDomain: "quotecall-ai.firebaseapp.com",
      projectId: "quotecall-ai",
      storageBucket: "quotecall-ai.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function ClientIntake({ config }) {
      return (
        <div class="max-w-xl mx-auto p-4 md:p-8 space-y-6">
          <div class="glass p-6 rounded-3xl text-center">
            <h1 class="text-2xl font-black uppercase tracking-tight text-white">{config.siteTitle}</h1>
            <p class="text-sm text-slate-400 mt-1">{config.siteSubtitle}</p>
          </div>

          <div class="glass p-6 rounded-3xl space-y-4">
            <button class="w-full py-4 rounded-2xl bg-cyan-600 hover:bg-cyan-500 font-black flex items-center justify-center gap-3 animate-pulse-glow">
              <i data-lucide="phone-call" class="w-6 h-6"></i>
              Start AI Voice Call
            </button>
          </div>
        </div>
      );
    }
    
    function ProviderDashboard({ config }) {
      return (
        <div class="p-4 md:p-8 space-y-6">
          <header class="flex justify-between items-center glass p-6 rounded-3xl">
            <h1 class="text-2xl font-black text-cyan-400">PROVIDER DASHBOARD</h1>
          </header>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-3xl"><h3 class="text-slate-400 text-xs uppercase font-bold">Active Dispatches</h3><p class="text-3xl font-black mt-2">12</p></div>
            <div class="glass p-6 rounded-3xl"><h3 class="text-slate-400 text-xs uppercase font-bold">Revenue</h3><p class="text-3xl font-black mt-2">$2,450</p></div>
            <div class="glass p-6 rounded-3xl"><h3 class="text-slate-400 text-xs uppercase font-bold">Pending</h3><p class="text-3xl font-black mt-2">4</p></div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('client');
      const [config, setConfig] = useState({ 
        siteTitle: "QuoteCall AI", 
        siteSubtitle: "Instant Field Service Dispatch" 
      });

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'provider') setView('provider');
      }, []);

      return (
        <div class="min-h-screen">
          {view === 'provider' ? <ProviderDashboard config={config} /> : <ClientIntake config={config} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    setTimeout(() => window.lucide.createIcons(), 500);
  </script>
</body>
</html>
