<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skynet One - Professional Starlink & Network Installation</title>
  
  <link rel="manifest" href="/manifest.json" />
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase JS SDK v10 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(0, 229, 255, 0.8); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .voice-wave {
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: currentColor;
      border-radius: 9999px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .voice-wave:nth-child(2) { animation-delay: 0.2s; }
    .voice-wave:nth-child(3) { animation-delay: 0.4s; }
    .voice-wave:nth-child(4) { animation-delay: 0.6s; }
    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 28px; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center justify-start p-3 md:p-8">

  <div id="root" class="w-full max-w-xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase Config fallback
    const firebaseConfig = {
      apiKey: "AIzaSy_MOCK_FIREBASE_KEY_FOR_QUOTECALL_AI",
      authDomain: "quotecall-ai.firebaseapp.com",
      projectId: "quotecall-ai",
      storageBucket: "quotecall-ai.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Starlink Installation Default Fallback Configuration
    const DEFAULT_CONFIG = {
      companyName: "Skynet One",
      siteTitle: "Skynet One Starlink Installation",
      siteSubtitle: "Official Starlink Dish Mounting, Fiber Cable Routing & Mesh Setup",
      themeColorHex: "#00E5FF",
      voiceCallButtonText: "Instant AI Dispatch / Voice Assistant",
      voiceCallDescription: "Speak or text directly with our AI assistant to book Starlink roof mounting, cable routing, or mesh setup.",
      quickDepositFee: 50.00,
      industry: "Starlink & Fiber Installation",
      logoUrl: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=150&auto=format&fit=crop&q=80",
      services: [
        { name: "Starlink Roof Mount", price: 200.00, desc: "Eaves/Ridge chimney bracket installation with obstruction check" },
        { name: "Custom Cable Routing", price: 75.00, desc: "Weatherproof exterior to interior wall conduit pass-through" },
        { name: "Mesh WiFi Setup", price: 199.00, desc: "Whole-home wireless mesh network integration and speed optimization" }
      ],
      systemInstruction: "You are the AI Assistant for Skynet One Starlink Installation. Greet the customer warmly, ask about their roof mounting or cabling needs, explain rates ($200 Roof Mount, $75 Cable Routing, $199 Mesh Setup), and provide a $50 deposit link to secure their installation slot. Sentiment Adaptation: Remain upbeat, confident, and empathetic. Adjust tone dynamically: calm and reassure anxious or stressed clients with soothing reassurance while remaining professional and direct."
    };

    function App() {
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [loading, setLoading] = useState(true);
      const [issueText, setIssueText] = useState("");
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [photoPreview, setPhotoPreview] = useState(null);
      
      // Gemini Voice State
      const [isLiveConnected, setIsLiveConnected] = useState(false);
      const [voiceStatus, setVoiceStatus] = useState("Disconnected");
      const [aiResponseText, setAiResponseText] = useState("");
      const [transcript, setTranscript] = useState([]);
      const [depositLink, setDepositLink] = useState(null);
      const [isProcessingStripe, setIsProcessingStripe] = useState(false);
      const [callDuration, setCallDuration] = useState(0);
      const [audioLevels, setAudioLevels] = useState([20, 40, 60, 30, 50]);
      const [showPostCallSummary, setShowPostCallSummary] = useState(false);

      // Audio level animation & Post-Call Summary trigger
      useEffect(() => {
        let levelInterval = null;
        if (isLiveConnected) {
          setShowPostCallSummary(false);
          levelInterval = setInterval(() => {
            setAudioLevels([
              Math.floor(Math.random() * 70) + 20,
              Math.floor(Math.random() * 85) + 15,
              Math.floor(Math.random() * 95) + 25,
              Math.floor(Math.random() * 75) + 20,
              Math.floor(Math.random() * 90) + 15
            ]);
          }, 150);
        } else {
          if (transcript.length > 0) {
            setShowPostCallSummary(true);
          }
        }
        return () => {
          if (levelInterval) clearInterval(levelInterval);
        };
      }, [isLiveConnected]);

      // Space bar keyboard shortcut to toggle voice call
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space' && activeTab === 'voice') {
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
              e.preventDefault();
              toggleGeminiLiveCall();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeTab, isLiveConnected]);

      // Download Transcript function
      const downloadTranscript = () => {
        const text = transcript.join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `skynet_one_call_transcript_${Date.now()}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // Auto-silence / inactivity detection timer (30 seconds)
      useEffect(() => {
        let silenceTimer = null;
        if (isLiveConnected) {
          silenceTimer = setTimeout(() => {
            if (mediaStreamRef.current) {
              mediaStreamRef.current.getTracks().forEach(track => track.stop());
              mediaStreamRef.current = null;
            }
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
            }
            setIsLiveConnected(false);
            setVoiceStatus("Call ended automatically due to 30s inactivity/silence.");
          }, 30000);
        }
        return () => {
          if (silenceTimer) clearTimeout(silenceTimer);
        };
      }, [isLiveConnected]);

      // Text Chat Fallback State
      const [activeTab, setActiveTab] = useState('voice'); // 'voice' or 'chat'
      const [chatInput, setChatInput] = useState('');
      const [chatMessages, setChatMessages] = useState([
        { sender: 'AI', text: 'Hello! Thanks for reaching out to Skynet One. How can I help with your Starlink or networking setup today?' }
      ]);
      const [isAiTyping, setIsAiTyping] = useState(false);

      // GPS Location State
      const [gpsLocation, setGpsLocation] = useState(null);
      const [isGettingGps, setIsGettingGps] = useState(false);
      const [gpsStatusMessage, setGpsStatusMessage] = useState("");
      const [copiedGpsLink, setCopiedGpsLink] = useState(false);

      // Dispatch Timeline State
      const [dispatchStage, setDispatchStage] = useState(0); // 0: Requested, 1: Tech Assigned, 2: En Route, 3: Arrived
      const [smsNotification, setSmsNotification] = useState(null);

      const mediaStreamRef = useRef(null);

      // Active Call Duration Timer
      useEffect(() => {
        let timer = null;
        if (isLiveConnected) {
          setCallDuration(0);
          timer = setInterval(() => {
            setCallDuration((prev) => prev + 1);
          }, 1000);
        } else {
          setCallDuration(0);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [isLiveConnected]);

      const formatCallDuration = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // Refresh Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Load Firestore Configuration for Tenant / Slug
      useEffect(() => {
        let isMounted = true;
        const loadTimer = setTimeout(() => {
          if (isMounted) setLoading(false);
        }, 1000);

        const searchParams = new URLSearchParams(window.location.search);
        let slug = searchParams.get("slug") || "tenant_starlink_batavia";

        db.collection("microsites").doc(slug).get()
          .then((doc) => {
            if (!isMounted) return;
            clearTimeout(loadTimer);
            if (doc.exists) {
              const data = doc.data();
              setConfig(prev => ({
                ...prev,
                companyName: data.businessName || data.companyName || "Skynet One",
                siteTitle: data.businessName || data.siteTitle || "Skynet One Starlink Installation",
                siteSubtitle: data.headline || data.siteSubtitle || "Official Starlink Dish Mounting, Fiber Cable Routing & Mesh Setup",
                themeColorHex: data.themeColors || "#00E5FF",
                quickDepositFee: data.depositAmount || 50.00,
                logoUrl: data.logoUrl || prev.logoUrl
              }));
            }
            setLoading(false);
          })
          .catch(() => {
            if (isMounted) setLoading(false);
          });

        return () => {
          isMounted = false;
          clearTimeout(loadTimer);
        };
      }, []);

      // Image selection handler
      const handleImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          setSelectedPhoto(file);
          const reader = new FileReader();
          reader.onloadend = () => setPhotoPreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      // Proactive Speech Greeting
      const speakProactiveGreeting = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          
          // Attempt to select a high-quality Google English voice
          const voices = window.speechSynthesis.getVoices();
          const googleVoice = voices.find(voice => 
            voice.name.includes("Google") && voice.lang.includes("en-US")
          );
          if (googleVoice) {
            utterance.voice = googleVoice;
          }
          
          // Tweak rate and pitch for a slightly more human feel
          utterance.rate = 1.0; 
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      };

      // Toggle AI Voice Assistant Call
      const toggleGeminiLiveCall = async () => {
        if (isLiveConnected) {
          if (mediaStreamRef.current) {
            mediaStreamRef.current.getTracks().forEach(track => track.stop());
            mediaStreamRef.current = null;
          }
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          setIsLiveConnected(false);
          setVoiceStatus("Call Ended");
          return;
        }

        try {
          setVoiceStatus("Requesting Microphone Access...");
          
          // Request microphone access
          let stream;
          try {
             stream = await navigator.mediaDevices.getUserMedia({ audio: true });
             mediaStreamRef.current = stream;
          } catch (micErr) {
             console.error("Microphone access denied or unavailable:", micErr);
             setVoiceStatus("Mic Error - Using Text Chat");
             setActiveTab('chat');
             return; // Stop if mic fails
          }

          setVoiceStatus("Microphone Active - Connected to Skynet One Assistant");
          setIsLiveConnected(true);

          const greeting = "Hello! Thanks for reaching out to Skynet One. How can I help with your Starlink or networking setup today?";
          setAiResponseText(`"${greeting}"`);
          speakProactiveGreeting(greeting);

          setTranscript([`[AI] ${greeting}`]);

          // Simulate user speech & auto booking link creation
          setTimeout(() => {
            setTranscript(prev => [...prev, "[User] I need a Starlink roof mount and custom cable routing for my home."]);
            const response2 = "I can definitely schedule our certified technician! Our Starlink Roof Mount is $200 and Custom Cable Routing is $75. I will generate a $50 deposit link right now to lock in your slot.";
            setAiResponseText(`"${response2}"`);
            speakProactiveGreeting(response2);
            setTranscript(prev => [...prev, `[AI] ${response2}`]);

            triggerStripeDepositFunctionCalling({
              serviceType: "Starlink Installation",
              depositAmount: config.quickDepositFee,
              notes: "Starlink Roof Mount ($200) & Cable Routing ($75)"
            });
          }, 4500);

        } catch (err) {
          console.error("Voice Assistant Error:", err);
          setVoiceStatus("Voice Assistant Unavailable");
          setIsLiveConnected(false);
        }
      };

      // Send Text Message (Interactive Text Chat Fallback)
      const handleSendChatMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const userMsg = chatInput.trim();
        setChatMessages(prev => [...prev, { sender: 'User', text: userMsg }]);
        setChatInput('');
        setIsAiTyping(true);

        setTimeout(() => {
          let aiReply = "I can help with your Starlink installation! Our standard rates are $200 for Roof Mounting, $75 for Cable Routing, and $199 for Mesh WiFi setup. Would you like to reserve a time slot with a $50 deposit?";
          
          if (userMsg.toLowerCase().includes("roof") || userMsg.toLowerCase().includes("mount") || userMsg.toLowerCase().includes("cable")) {
            aiReply = "Great! For a Starlink Roof Mount ($200) and Cable Pass-through ($75), our certified technician can arrive tomorrow. Click the Quick Deposit button below to reserve your slot!";
            triggerStripeDepositFunctionCalling({ serviceType: "Starlink Roof Mount", depositAmount: 50.00, notes: userMsg });
          } else if (userMsg.toLowerCase().includes("deposit") || userMsg.toLowerCase().includes("book") || userMsg.toLowerCase().includes("price")) {
            triggerStripeDepositFunctionCalling({ serviceType: "Starlink Installation", depositAmount: 50.00, notes: userMsg });
          }

          setChatMessages(prev => [...prev, { sender: 'AI', text: aiReply }]);
          setIsAiTyping(false);
        }, 1000);
      };

      // Stripe Deposit Function Call Callback
      const triggerStripeDepositFunctionCalling = (params) => {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${params.depositAmount || 50.00}`;
          setDepositLink(generatedCheckoutUrl);
          setIsProcessingStripe(false);
          setDispatchStage(1);
        }, 800);
      };

      // Direct Deposit Button Click
      const handleDirectDeposit = () => {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${config.quickDepositFee}`;
          setDepositLink(generatedCheckoutUrl);
          setDispatchStage(2);

          const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setSmsNotification({
            phone: "+1 (800) 555-0199",
            trackingId: `SLK-${Math.floor(1000 + Math.random() * 9000)}`,
            message: `CONFIRMED: $${config.quickDepositFee.toFixed(2)} deposit received for ${config.companyName}. Certified installer Unit #402 scheduled for your location!`,
            timestamp: timeStr
          });

          window.open(generatedCheckoutUrl, '_blank');
          setIsProcessingStripe(false);
        }, 600);
      };

      // GPS Location Request
      const requestGpsLocation = () => {
        if (!navigator.geolocation) {
          setGpsStatusMessage("Geolocation is not supported by your browser.");
          return;
        }
        setIsGettingGps(true);
        setGpsStatusMessage("Fetching installation site coordinates...");

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            setGpsLocation({
              latitude: lat,
              longitude: lng,
              accuracy: position.coords.accuracy.toFixed(1),
              mapsUrl: `https://maps.google.com/?q=${lat},${lng}`
            });
            setIsGettingGps(false);
            setGpsStatusMessage("Installation Site GPS Location Acquired!");
          },
          () => {
            setIsGettingGps(false);
            setGpsStatusMessage("Location permission denied.");
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-[60vh] space-y-4">
            <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-400 font-medium text-sm">Loading Skynet One Starlink Microsite...</p>
          </div>
        );
      }

      return (
        <div class="space-y-5">
          
          {/* Header Banner */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute -top-12 -right-12 w-32 h-32 rounded-full opacity-20 blur-2xl" style={{ backgroundColor: config.themeColorHex }}></div>
            
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 mb-3 shadow-inner overflow-hidden mx-auto">
              <img src={config.logoUrl} alt="Skynet One Logo" class="w-full h-full object-cover" />
            </div>

            <h1 class="text-2xl md:text-3xl font-black tracking-tight text-white uppercase">{config.siteTitle}</h1>
            <p class="text-xs md:text-sm text-slate-400 mt-1 font-medium">{config.siteSubtitle}</p>
            
            <div class="inline-flex items-center gap-2 mt-3 px-3.5 py-1 rounded-full bg-slate-800/90 border border-slate-700 text-[11px] font-semibold text-cyan-400">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Official Starlink Certified Installer • 24/7 AI Dispatch Active
            </div>
          </div>

          {/* Starlink Service Catalog Showcase Card */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="wifi" class="w-4 h-4 text-cyan-400"></i>
              Official Installation Rates & Services
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
              {config.services.map((s, idx) => (
                <div key={idx} class="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1">
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-white">{s.name}</span>
                    <span class="text-xs font-black text-cyan-400">${s.price.toInt ? s.price.toInt() : s.price}</span>
                  </div>
                  <p class="text-[10px] text-slate-400 leading-tight">{s.desc}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Dispatch Progress Stepper */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i>
                Installation Booking Status
              </h3>
              <span class={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full border ${
                dispatchStage === 3 ? 'bg-emerald-950 text-emerald-400 border-emerald-800' :
                dispatchStage === 1 ? 'bg-cyan-950 text-cyan-400 border-cyan-800 animate-pulse' :
                'bg-slate-800 text-slate-400 border-slate-700'
              }`}>
                {dispatchStage === 3 ? 'Installed' : dispatchStage === 1 ? 'Slot Reserved' : 'Pending Request'}
              </span>
            </div>

            <div class="p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-300 flex items-center gap-2">
              <i data-lucide="info" class="w-4 h-4 text-cyan-400 flex-shrink-0"></i>
              <span>
                {dispatchStage === 0 && "Select voice or text assistant below to request Starlink installation details."}
                {dispatchStage === 1 && "Installation slot reserved for Skynet One! Complete $50 deposit below to confirm tech."}
                {dispatchStage === 2 && "Certified Technician Unit #402 is en route to your installation address."}
                {dispatchStage === 3 && "Installation completed! Dish aligned & speed test verified."}
              </span>
            </div>
          </div>

          {/* SMS Notification Banner */}
          {smsNotification && (
            <div class="bg-gradient-to-r from-emerald-950/90 to-slate-900 border border-emerald-500/50 rounded-3xl p-4 shadow-2xl text-left space-y-2">
              <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
                <span>📱 SMS Booking Confirmation Sent</span>
                <span class="text-[10px] font-mono text-slate-400">{smsNotification.timestamp}</span>
              </div>
              <p class="text-xs font-mono text-emerald-300 bg-slate-950 p-3 rounded-xl border border-slate-800">
                {smsNotification.message}
              </p>
            </div>
          )}

          {/* Assistant Interface Tabs: Voice Assistant vs Interactive Text Chat */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
            
            {/* Tab Selector Buttons */}
            <div class="flex rounded-xl bg-slate-950 p-1 border border-slate-800">
              <button
                onClick={() => setActiveTab('voice')}
                class={`flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition-all ${
                  activeTab === 'voice' ? 'bg-cyan-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <i data-lucide="mic" class="w-4 h-4"></i>
                <span>AI Voice Assistant</span>
              </button>

              <button
                onClick={() => setActiveTab('chat')}
                class={`flex-1 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 transition-all ${
                  activeTab === 'chat' ? 'bg-cyan-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <i data-lucide="message-square" class="w-4 h-4"></i>
                <span>Interactive Text Chat</span>
              </button>
            </div>

            {/* TAB 1: AI Voice Assistant */}
            {activeTab === 'voice' && (
              <div class="space-y-3 text-center">
                <div class="flex items-center justify-between px-1">
                  <p class="text-xs text-slate-400">{config.voiceCallDescription}</p>
                  <span class="text-[10px] font-mono text-cyan-400 bg-cyan-950/80 px-2 py-0.5 rounded border border-cyan-800">
                    Press [Space] to Toggle
                  </span>
                </div>

                <button
                  onClick={toggleGeminiLiveCall}
                  style={{ backgroundColor: isLiveConnected ? '#EF4444' : config.themeColorHex }}
                  class={`w-full py-4 px-6 rounded-2xl text-slate-950 font-black text-base flex items-center justify-center gap-3 shadow-lg transition-all transform active:scale-95 ${!isLiveConnected ? 'animate-pulse-glow' : ''}`}
                >
                  {isLiveConnected ? (
                    <>
                      <i data-lucide="phone-off" class="w-5 h-5 text-white"></i>
                      <span class="text-white">End Voice Call</span>
                    </>
                  ) : (
                    <>
                      <i data-lucide="phone-call" class="w-5 h-5"></i>
                      <span>Start AI Voice Call</span>
                    </>
                  )}
                </button>

                <div class="w-full space-y-3">
                  {isLiveConnected && (
                    <div class="p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 text-left space-y-3">
                      <div class="flex items-center justify-between text-xs font-semibold text-cyan-400">
                        <span class="flex items-center gap-2">
                          <span class="voice-wave"></span>
                          <span class="voice-wave"></span>
                          <span class="voice-wave"></span>
                          {voiceStatus}
                        </span>
                        <span class="font-mono text-cyan-300 bg-cyan-950/80 border border-cyan-800 px-2 py-0.5 rounded-lg text-xs font-bold">
                          {formatCallDuration(callDuration)}
                        </span>
                      </div>

                      {/* Real-time animated audio input level bar */}
                      <div class="space-y-1">
                        <div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">
                          <span>MIC INPUT LEVEL (CONFIRMED)</span>
                          <span class="text-cyan-400">ACTIVE</span>
                        </div>
                        <div class="flex items-center justify-center gap-1.5 h-6 bg-slate-900 px-3 rounded-lg border border-slate-800">
                          {audioLevels.map((lvl, idx) => (
                            <div key={idx} class="flex-1 bg-cyan-400 rounded-full transition-all duration-150" style={{ height: `${lvl}%` }}></div>
                          ))}
                        </div>
                      </div>

                      {aiResponseText && (
                        <p class="text-xs text-slate-200 bg-slate-900 p-3 rounded-xl border border-slate-800 italic">
                          {aiResponseText}
                        </p>
                      )}
                    </div>
                  )}

                  {/* Transcript Download Button */}
                  {!isLiveConnected && transcript.length > 0 && (
                    <button
                      onClick={downloadTranscript}
                      class="w-full py-2.5 px-4 rounded-xl bg-slate-950 border border-slate-700 text-cyan-400 text-xs font-bold flex items-center justify-center gap-2 hover:bg-slate-800 transition-all shadow"
                    >
                      <i data-lucide="download" class="w-4 h-4"></i>
                      <span>Download Call Transcript (.txt)</span>
                    </button>
                  )}

                  {/* Post-Call Summary Component */}
                  {showPostCallSummary && (
                    <div class="bg-slate-950 border border-cyan-500/50 rounded-2xl p-4 text-left space-y-3 shadow-2xl animate-fade-in">
                      <div class="flex items-center justify-between">
                        <h4 class="text-xs font-bold text-cyan-400 uppercase flex items-center gap-2">
                          <i data-lucide="check-circle" class="w-4 h-4 text-cyan-400"></i>
                          Post-Call Installation Summary
                        </h4>
                        <span class="text-[10px] font-mono bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-800">
                          Duration: {formatCallDuration(callDuration)}
                        </span>
                      </div>
                      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1 text-xs text-slate-300">
                        <p><strong class="text-white">Scope:</strong> Starlink Roof Mount & Cable Routing</p>
                        <p><strong class="text-white">Estimated Total:</strong> $275.00</p>
                        <p><strong class="text-white">Deposit Required:</strong> ${config.quickDepositFee.toFixed(2)}</p>
                      </div>
                      <button
                        onClick={handleDirectDeposit}
                        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-400 to-teal-400 text-slate-950 font-black text-xs flex items-center justify-center gap-2 shadow-lg"
                      >
                        <i data-lucide="credit-card" class="w-4 h-4"></i>
                        <span>Confirm Booking & Pay ${config.quickDepositFee.toFixed(2)} Deposit</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 2: Interactive Text Chat Fallback */}
            {activeTab === 'chat' && (
              <div class="space-y-3">
                <div class="h-56 overflow-y-auto bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2 text-xs">
                  {chatMessages.map((msg, i) => (
                    <div key={i} class={`flex ${msg.sender === 'User' ? 'justify-end' : 'justify-start'}`}>
                      <div class={`max-w-[80%] p-2.5 rounded-xl ${
                        msg.sender === 'User' ? 'bg-cyan-500 text-slate-950 font-medium' : 'bg-slate-900 text-slate-200 border border-slate-800'
                      }`}>
                        <p class="text-[10px] opacity-70 font-bold mb-0.5">{msg.sender}</p>
                        <p>{msg.text}</p>
                      </div>
                    </div>
                  ))}
                  {isAiTyping && (
                    <div class="flex justify-start">
                      <div class="bg-slate-900 text-slate-400 p-2 rounded-xl border border-slate-800 italic text-[11px]">
                        Skynet One AI is typing...
                      </div>
                    </div>
                  )}
                </div>

                <form onSubmit={handleSendChatMessage} class="flex gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask about roof mount, pricing ($200/$75), or booking..."
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                  />
                  <button
                    type="submit"
                    class="px-4 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition-all"
                  >
                    Send
                  </button>
                </form>
              </div>
            )}
          </div>

          {/* Section: Installation Site Description & Photo Upload */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
            <h3 class="text-xs font-bold text-slate-200 flex items-center gap-2">
              <i data-lucide="camera" class="w-4 h-4 text-cyan-400"></i>
              Describe Site or Attach Roof/Wall Photo
            </h3>

            <textarea
              value={issueText}
              onChange={(e) => setIssueText(e.target.value)}
              placeholder="Describe your Starlink installation, roof mount, obstruction check, or custom networking setup needs..."
              class="w-full h-20 p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-all resize-none"
            ></textarea>

            <div class="flex items-center gap-3">
              <label class="flex-1 cursor-pointer flex items-center justify-center gap-2 p-3 bg-slate-950 border border-dashed border-slate-700 rounded-2xl text-xs text-slate-400 hover:border-cyan-400 hover:text-cyan-400 transition-all">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span class="truncate">{selectedPhoto ? selectedPhoto.name : "Attach Photo of Installation Site or Roof"}</span>
                <input type="file" accept="image/*" onChange={handleImageUpload} class="hidden" />
              </label>

              {photoPreview && (
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-cyan-500 relative flex-shrink-0">
                  <img src={photoPreview} alt="Roof Preview" class="w-full h-full object-cover" />
                </div>
              )}
            </div>
          </div>

          {/* Section: Installation Site Live GPS Location */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-200 flex items-center gap-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-cyan-400"></i>
                Installation Address GPS Pin
              </h3>
              {gpsLocation && (
                <span class="text-[10px] font-extrabold text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded-full">
                  GPS Pin Set
                </span>
              )}
            </div>

            <button
              onClick={requestGpsLocation}
              disabled={isGettingGps}
              class="w-full py-2.5 px-4 rounded-xl bg-slate-950 border border-slate-700 hover:border-cyan-400 text-cyan-400 font-bold text-xs flex items-center justify-center gap-2 transition-all"
            >
              {isGettingGps ? (
                <span>Fetching Coordinates...</span>
              ) : (
                <>
                  <i data-lucide="crosshair" class="w-4 h-4"></i>
                  <span>{gpsLocation ? "Update GPS Location" : "Share Installation GPS Location"}</span>
                </>
              )}
            </button>

            {gpsStatusMessage && (
              <p class="text-[11px] text-center font-medium text-slate-400">{gpsStatusMessage}</p>
            )}
          </div>

          {/* Section: Stripe Security Deposit Booking */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl text-center space-y-3">
            <div class="flex items-center justify-between">
              <div class="text-left">
                <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">Security Booking Deposit</span>
                <p class="text-xl font-black text-white">${config.quickDepositFee.toFixed(2)} USD</p>
              </div>
              <div class="flex items-center gap-1 text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800 px-2.5 py-1 rounded-xl">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Stripe Secured</span>
              </div>
            </div>

            <button
              onClick={handleDirectDeposit}
              disabled={isProcessingStripe}
              class="w-full py-3 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 disabled:opacity-50"
            >
              {isProcessingStripe ? (
                <span>Generating Stripe Link...</span>
              ) : (
                <>
                  <i data-lucide="credit-card" class="w-4 h-4"></i>
                  <span>Book Slot with $50 Deposit via Stripe</span>
                </>
              )}
            </button>

            {depositLink && (
              <div class="p-3 rounded-2xl bg-emerald-950/40 border border-emerald-500/50 text-left space-y-2">
                <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
                  <span>AI Generated Stripe Deposit Link</span>
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                </div>
                <a
                  href={depositLink}
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full py-2 bg-emerald-500 text-slate-950 font-black text-xs text-center rounded-xl shadow hover:bg-emerald-400 transition-all"
                >
                  Pay $50 Deposit Now to Confirm Starlink Tech
                </a>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer class="text-center pt-3 pb-6 space-y-1">
            <p class="text-[11px] text-slate-500 font-medium">Powered by Skynet One & QuoteBit Engine</p>
            <p class="text-[10px] text-slate-600">Certified Starlink Field Installation • AI Voice & Text Dispatch</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 400);
  </script>
</body>
</html>
