    const { useState, useEffect, useRef } = React;

    // React Error Boundary to prevent black screen crashes
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("App Error Caught by Boundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div class="p-6 bg-slate-900 border border-red-500/50 rounded-3xl text-center space-y-4 my-8">
              <h2 class="text-lg font-bold text-red-400">Assistant Encountered a Temporary Error</h2>
              <p class="text-xs text-slate-300">The page remained visible and protected from crashing. Click below to reload the assistant.</p>
              <button 
                onClick={() => this.setState({ hasError: false })}
                class="px-5 py-2.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl shadow hover:bg-cyan-400"
              >
                Reload Assistant UI
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

      // Space bar keyboard shortcut to toggle voice call

        URL.revokeObjectURL(url);

        return () => {

        };
      }, [isLiveConnected]);

      // Text Chat Fallback State

      const [chatMessages, setChatMessages] = useState([
        { sender: 'AI', text: 'Hello! Thanks for reaching out to Skynet One. How can I help with your Starlink or networking setup today?' }

      const [isAiTyping, setIsAiTyping] = useState(false);

            setCallDuration((prev) => prev + 1);
          }, 1000);
        } else {
          setCallDuration(0);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [isLiveConnected]);

      const formatCallDuration = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // Refresh Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Load Firestore Configuration for Tenant / Slug
      useEffect(() => {
        let isMounted = true;
        const loadTimer = setTimeout(() => {
          if (isMounted) setLoading(false);
        }, 1000);

        const searchParams = new URLSearchParams(window.location.search);
        let slug = searchParams.get("slug") || "tenant_starlink_batavia";

        db.collection("microsites").doc(slug).get()
          .then((doc) => {
            if (!isMounted) return;
            clearTimeout(loadTimer);
            if (doc.exists) {
              const data = doc.data();
              setConfig(prev => ({
                ...prev,
                companyName: data.businessName || data.companyName || "Skynet One",
                siteTitle: data.businessName || data.siteTitle || "Skynet One Starlink Installation",
                siteSubtitle: data.headline || data.siteSubtitle || "Official Starlink Dish Mounting, Fiber Cable Routing & Mesh Setup",
                themeColorHex: data.themeColors || "#00E5FF",
                quickDepositFee: data.depositAmount || 50.00,
                logoUrl: data.logoUrl || prev.logoUrl,

          .catch(() => {
            if (isMounted) setLoading(false);

        return () => {
          isMounted = false;
          clearTimeout(loadTimer);

      function triggerStripeDepositFunctionCalling(params) {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${params.depositAmount || 50.00}`;

          setIsProcessingStripe(false);

        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Attempt to select a high-quality voice
            const voices = window.speechSynthesis.getVoices();
            const googleVoice = voices.find(voice => 
              voice && voice.name && voice.name.includes("Google") && voice.lang && voice.lang.includes("en")
            );
            if (googleVoice) {
              utterance.voice = googleVoice;
            }
            
            utterance.rate = 1.0; 
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
          }
        } catch (err) {
          console.warn("Speech synthesis notice:", err);
        }
      };

      // Toggle AI Voice Assistant Call
      const toggleGeminiLiveCall = async () => {
        if (isLiveConnected) {
          if (mediaStreamRef.current) {
            mediaStreamRef.current.getTracks().forEach(track => track.stop());
            mediaStreamRef.current = null;
          }
          if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          setIsLiveConnected(false);
          setVoiceStatus("Call Ended");
          return;
        }

        try {
          setVoiceStatus("Requesting Microphone Access...");
          
          // Request microphone access safely
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaStreamRef.current = stream;
              setVoiceStatus("Microphone Active - Connected to Skynet One Assistant");
            } catch (micErr) {
              console.warn("Microphone access permission notice:", micErr);
              setVoiceStatus("Voice Assistant Active (Demo Mode)");

          } else {
            console.warn("navigator.mediaDevices not available in current container environment.");
            setVoiceStatus("Voice Assistant Active (Demo Mode)");

          setIsLiveConnected(true);

          const greeting = "Hello! Thanks for reaching out to Skynet One. How can I help with your Starlink or networking setup today?";

          speakProactiveGreeting(greeting);

      // Send Text Message (Intelligent Multi-lingual AI Assistant)
      const handleSendChatMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const userMsg = chatInput.trim();
        const lowerMsg = userMsg.toLowerCase();
        
        setChatMessages(prev => [...prev, { sender: 'User', text: userMsg }]);
        setChatInput('');
        setIsAiTyping(true);

        setTimeout(() => {
          let aiReply = "";
          let isPolish = /[ąćęłńóśźż]|tak|nie|dzięki|dobrze|dystans|montaż|cena|koszt|instalacja|rezerwacja|proszę/i.test(lowerMsg);

          // Check for affirmative responses (e.g. "yes", "tak", "sure", "ok", "book it")

                                lowerMsg.includes("yes") || lowerMsg.includes("tak") || lowerMsg.includes("reserve") || lowerMsg.includes("rezerwuj");

            const sName = s.name.toLowerCase();
            return lowerMsg.split(' ').some(word => word.length > 2 && sName.includes(word));
          });

          if (isAffirmative) {

              ) : (
                <>
                  <Icon name="credit-card" className="w-4 h-4" />
                  <span>Book Slot with $50 Deposit via Stripe</span>
                </>
              )}
            </button>

            {depositLink && (
              <div class="p-3 rounded-2xl bg-emerald-950/40 border border-emerald-500/50 text-left space-y-2">
                <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
                  <span>AI Generated Stripe Deposit Link</span>
                  <Icon name="external-link" className="w-4 h-4" />
                </div>
                <a
                  href={depositLink}
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full py-2 bg-emerald-500 text-slate-950 font-black text-xs text-center rounded-xl shadow hover:bg-emerald-400 transition-all"
                >
                  Pay $50 Deposit Now to Confirm Starlink Tech
                </a>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer class="text-center pt-3 pb-6 space-y-1">
            <p class="text-[11px] text-slate-500 font-medium">Powered by Skynet One & QuoteBit Engine</p>
            <p class="text-[10px] text-slate-600">Certified Starlink Field Installation • AI Voice & Text Dispatch</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
