<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteCall AI - Instant Service Dispatch & Micro-site Engine</title>
  
  <link rel="manifest" href="/manifest.json" />
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase JS SDK v10 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(0, 229, 255, 0.8); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .voice-wave {
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: currentColor;
      border-radius: 9999px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .voice-wave:nth-child(2) { animation-delay: 0.2s; }
    .voice-wave:nth-child(3) { animation-delay: 0.4s; }
    .voice-wave:nth-child(4) { animation-delay: 0.6s; }
    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 28px; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center justify-start p-4 md:p-8">

  <div id="root" class="w-full max-w-xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase Config fallback
    const firebaseConfig = {
      apiKey: "AIzaSy_MOCK_FIREBASE_KEY_FOR_QUOTECALL_AI",
      authDomain: "quotecall-ai.firebaseapp.com",
      projectId: "quotecall-ai",
      storageBucket: "quotecall-ai.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Default Fallback Configuration JSON
    const DEFAULT_CONFIG = {
      companyName: "SKYNET CONNECT",
      siteTitle: "SKYNET MESH SETUP",
      siteSubtitle: "Instant AI Dispatch & On-Demand Network Setup",
      themeColorHex: "#00E5FF",
      voiceCallButtonText: "Instant AI Dispatch / Live Voice",
      voiceCallDescription: "Speak directly with our AI agent to describe your setup needs and request immediate help.",
      quickDepositFee: 50.00,
      industry: "Networking & Internet Setup",
      logoUrl: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=150&auto=format&fit=crop&q=80",
      systemInstruction: "You are an emergency service dispatcher for Skynet Connect. Ask the caller for their network setup details, location, and issue type. When you have enough details, call the 'create_stripe_deposit_link' tool to send them a $50 deposit checkout link."
    };

    function App() {
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [loading, setLoading] = useState(true);
      const [issueText, setIssueText] = useState("");
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [photoPreview, setPhotoPreview] = useState(null);
      
      // Gemini Voice State
      const [isLiveConnected, setIsLiveConnected] = useState(false);
      const [voiceStatus, setVoiceStatus] = useState("Disconnected");
      const [aiResponseText, setAiResponseText] = useState("");
      const [transcript, setTranscript] = useState([]); // Add transcript state
      const [depositLink, setDepositLink] = useState(null);
      const [isProcessingStripe, setIsProcessingStripe] = useState(false);
      const [notFound, setNotFound] = useState(false);
      const [callDuration, setCallDuration] = useState(0);

      // GPS Location Dispatch State
      const [gpsLocation, setGpsLocation] = useState(null);
      const [isGettingGps, setIsGettingGps] = useState(false);
      const [gpsStatusMessage, setGpsStatusMessage] = useState("");
      const [copiedGpsLink, setCopiedGpsLink] = useState(false);

      // Active Call Duration Timer (MM:SS)
      useEffect(() => {
        let timer = null;
        if (isLiveConnected) {
          setCallDuration(0);
          timer = setInterval(() => {
            setCallDuration((prev) => prev + 1);
          }, 1000);
        } else {
          setCallDuration(0);
        }
        return () => {
          if (timer) clearInterval(timer);
        };
      }, [isLiveConnected]);

      const formatCallDuration = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const handleCopyGpsLink = () => {
        if (gpsLocation && gpsLocation.mapsUrl) {
          navigator.clipboard.writeText(gpsLocation.mapsUrl);
          setCopiedGpsLink(true);
          setTimeout(() => setCopiedGpsLink(false), 2000);
        }
      };

      // Dispatch Timeline & SMS State
      const [dispatchStage, setDispatchStage] = useState(0); // 0: Requested, 1: Driver Assigned, 2: En Route, 3: Arrived
      const [smsNotification, setSmsNotification] = useState(null);

      const wsRef = useRef(null);
      const audioContextRef = useRef(null);
      const mediaStreamRef = useRef(null);

      // Refresh Lucide Icons whenever component updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Extract slug from URL: /site/[slug], /[slug], or ?slug=[slug]
      useEffect(() => {
        let isMounted = true;
        const loadTimer = setTimeout(() => {
          if (isMounted) {
            setLoading(false);
          }
        }, 1200);

        const searchParams = new URLSearchParams(window.location.search);
        let slug = searchParams.get("slug");

        if (!slug) {
          const pathParts = window.location.pathname.split("/").filter(Boolean);
          if (pathParts.length > 0) {
            slug = pathParts[0] === "site" && pathParts[1] ? pathParts[1] : pathParts[0];
          }
        }

        if (slug) {
          slug = slug.toLowerCase().trim().replace(/[^a-z0-9-]+/g, "");
          // Slug mapping
          const SLUG_MAPPING = {
            "skynet-one": "tenant_starlink_batavia"
          };
          if (SLUG_MAPPING[slug]) {
            slug = SLUG_MAPPING[slug];
          }
        }

        if (!slug || slug === "index" || slug === "index.html") {
          slug = "tenant_starlink_batavia";
        }

        const formatTitleFromSlug = (s) => {
          return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        };

        const formattedName = formatTitleFromSlug(slug);

        // Fetch Config from Firestore collection 'microsites/{slug}'
        db.collection("microsites").doc(slug).get()
          .then((doc) => {
            if (!isMounted) return;
            clearTimeout(loadTimer);
            if (doc.exists) {
              const data = doc.data();
              setConfig({
                slug: slug,
                companyName: data.businessName || data.companyName || formattedName,
                siteTitle: data.businessName || data.siteTitle || formattedName,
                siteSubtitle: data.headline || data.siteSubtitle || "24/7 Professional On-Demand Dispatch",
                themeColorHex: data.themeColors || data.themeColorHex || DEFAULT_CONFIG.themeColorHex,
                voiceCallButtonText: data.voiceCallButtonText || DEFAULT_CONFIG.voiceCallButtonText,
                voiceCallDescription: data.voiceCallDescription || DEFAULT_CONFIG.voiceCallDescription,
                quickDepositFee: data.depositAmount || data.quickDepositFee || DEFAULT_CONFIG.quickDepositFee,
                providerPhoneNumber: data.ownerPhoneNumber || DEFAULT_CONFIG.providerPhoneNumber,
                stripeAccountId: data.stripeAccountId || DEFAULT_CONFIG.stripeAccountId,
                industry: data.industry || DEFAULT_CONFIG.industry,
                logoUrl: data.logoUrl || DEFAULT_CONFIG.logoUrl,
                systemInstruction: data.systemInstruction || DEFAULT_CONFIG.systemInstruction
              });
              setNotFound(false);
            } else {
              // Fallback to 'sites/{slug}' or format brand title from slug
              db.collection("sites").doc(slug).get().then((siteDoc) => {
                if (!isMounted) return;
                if (siteDoc.exists) {
                  const data = siteDoc.data();
                  setConfig({
                    slug: slug,
                    companyName: data.businessName || data.companyName || formattedName,
                    siteTitle: data.businessName || data.siteTitle || formattedName,
                    siteSubtitle: data.headline || data.siteSubtitle || "24/7 Professional On-Demand Dispatch",
                    themeColorHex: data.themeColors || data.themeColorHex || DEFAULT_CONFIG.themeColorHex,
                    voiceCallButtonText: data.voiceCallButtonText || DEFAULT_CONFIG.voiceCallButtonText,
                    voiceCallDescription: data.voiceCallDescription || DEFAULT_CONFIG.voiceCallDescription,
                    quickDepositFee: data.depositAmount || data.quickDepositFee || DEFAULT_CONFIG.quickDepositFee,
                    providerPhoneNumber: data.ownerPhoneNumber || DEFAULT_CONFIG.providerPhoneNumber,
                    stripeAccountId: data.stripeAccountId || DEFAULT_CONFIG.stripeAccountId,
                    industry: data.industry || DEFAULT_CONFIG.industry,
                    logoUrl: data.logoUrl || DEFAULT_CONFIG.logoUrl,
                    systemInstruction: data.systemInstruction || DEFAULT_CONFIG.systemInstruction
                  });
                  setNotFound(false);
                } else {
                  setConfig({
                    ...DEFAULT_CONFIG,
                    slug: slug,
                    companyName: formattedName,
                    siteTitle: formattedName
                  });
                  setNotFound(false);
                }
                setLoading(false);
              }).catch(() => {
                if (!isMounted) return;
                setConfig({
                  ...DEFAULT_CONFIG,
                  slug: slug,
                  companyName: formattedName,
                  siteTitle: formattedName
                });
                setNotFound(false);
                setLoading(false);
              });
            }
            setLoading(false);
          })
          .catch((err) => {
            console.warn("Firestore fetch error:", err);
            if (!isMounted) return;
            clearTimeout(loadTimer);
            setConfig({
              ...DEFAULT_CONFIG,
              slug: slug,
              companyName: formattedName,
              siteTitle: formattedName
            });
            setNotFound(false);
            setLoading(false);
          });

        return () => {
          isMounted = false;
          clearTimeout(loadTimer);
        };
      }, []);

      // Handle Image Selection
      const handleImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          setSelectedPhoto(file);
          const reader = new FileReader();
          reader.onloadend = () => {
            setPhotoPreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const removePhoto = () => {
        setSelectedPhoto(null);
        setPhotoPreview(null);
      };

      // Handle Live GPS Location Fetching
      const requestGpsLocation = () => {
        if (!navigator.geolocation) {
          setGpsStatusMessage("Geolocation is not supported by your browser.");
          return;
        }
        setIsGettingGps(true);
        setGpsStatusMessage("Fetching precise GPS coordinates...");

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            const mapsUrl = `https://maps.google.com/?q=${lat},${lng}`;
            setGpsLocation({
              latitude: lat,
              longitude: lng,
              accuracy: position.coords.accuracy.toFixed(1),
              mapsUrl: mapsUrl
            });
            setIsGettingGps(false);
            setGpsStatusMessage("GPS Location Acquired!");
          },
          (error) => {
            console.warn("Geolocation error:", error);
            setIsGettingGps(false);
            switch(error.code) {
              case error.PERMISSION_DENIED:
                setGpsStatusMessage("Location permission denied. Please allow location access.");
                break;
              case error.POSITION_UNAVAILABLE:
                setGpsStatusMessage("Location position unavailable.");
                break;
              case error.TIMEOUT:
                setGpsStatusMessage("Location request timed out.");
                break;
              default:
                setGpsStatusMessage("Failed to fetch location.");
            }
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
      };

      // Initiate Gemini Live Audio Session with real microphone permission
      const toggleGeminiLiveCall = async () => {
        if (isLiveConnected) {
          // Disconnect & release microphone
          if (wsRef.current) wsRef.current.close();
          if (mediaStreamRef.current) {
            mediaStreamRef.current.getTracks().forEach(track => track.stop());
            mediaStreamRef.current = null;
          }
          setIsLiveConnected(false);
          setVoiceStatus("Call Ended");
          return;
        }

        try {
          setVoiceStatus("Requesting Microphone Access...");
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStreamRef.current = stream;
          }

          setVoiceStatus("Microphone Active - Connecting to AI Voice...");
          setIsLiveConnected(true);

          // AudioContext setup
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

          setVoiceStatus("Connected - Listening...");
          setAiResponseText(`"Hello! This is ${config.companyName} AI Dispatcher. Speak directly to describe your breakdown or service need, and I will arrange service and send a deposit checkout link."`);

          // Simulate transcript
          const transcriptSim = setInterval(() => {
            setTranscript(prev => [...prev, `[User] ${["Need help with", "Battery is dead", "Can you tow", "Emergency help"][Math.floor(Math.random() * 4)]} ...`]);
          }, 2000);

          // Simulate function calling callback after 4 seconds of voice conversation
          setTimeout(() => {
            clearInterval(transcriptSim);
            triggerStripeDepositFunctionCalling({
              serviceType: config.industry,
              depositAmount: config.quickDepositFee,
              notes: issueText || "Emergency Dispatch Requested via AI Voice"
            });
          }, 8000);

        } catch (err) {
          console.error("Microphone/Gemini Live Error:", err);
          let errMsg = "Connection Error";
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            errMsg = "Microphone Permission Denied by User";
          } else if (err.message) {
            errMsg = err.message;
          }
          setVoiceStatus(errMsg);
          setIsLiveConnected(false);
        }
      };

      // Function Calling Callback triggered by Gemini Live API
      const triggerStripeDepositFunctionCalling = (params) => {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${params.depositAmount || config.quickDepositFee}`;
          setDepositLink(generatedCheckoutUrl);
          setIsProcessingStripe(false);
          setDispatchStage(1); // Stage 1: Driver Assigned
          setAiResponseText(`"I have set up your dispatch record! Click the Quick Deposit button below to confirm your $${params.depositAmount || config.quickDepositFee} security deposit and dispatch a technician instantly."`);
        }, 1200);
      };

      // Direct Deposit Button Action & SMS Notification Trigger
      const handleDirectDeposit = () => {
        setIsProcessingStripe(true);
        setTimeout(() => {
          const generatedCheckoutUrl = `https://checkout.stripe.com/c/pay/cs_test_quotecall_${Date.now()}?amount=${config.quickDepositFee}`;
          setDepositLink(generatedCheckoutUrl);
          setDispatchStage(2); // Stage 2: En Route

          // Trigger SMS Confirmation Payload
          const trackingId = `TRK-${Math.floor(1000 + Math.random() * 9000)}`;
          const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setSmsNotification({
            phone: config.providerPhoneNumber || "+1 (800) 555-0199",
            trackingId: trackingId,
            message: `CONFIRMED: $${config.quickDepositFee.toFixed(2)} deposit received for ${config.companyName}. Dispatch Unit #402 en route to your location! Track live: https://quotecall.ai/track/${trackingId}`,
            timestamp: timeStr
          });

          // Simulate arrival stage after 10s
          setTimeout(() => {
            setDispatchStage(3); // Stage 3: Arrived
          }, 10000);

          window.open(generatedCheckoutUrl, '_blank');
          setIsProcessingStripe(false);
        }, 800);
      };

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-[60vh] space-y-4">
            <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-400 font-medium text-sm">Loading QuoteCall AI Micro-site...</p>
          </div>
        );
      }

      if (notFound) {
        return (
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl max-w-md mx-auto my-12">
            <div class="w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto text-red-400">
              <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <div>
              <span class="px-3 py-1 bg-red-500/20 border border-red-500/40 text-red-400 font-extrabold text-xs rounded-full uppercase tracking-wider">
                404 Error
              </span>
              <h1 class="text-2xl font-black text-white mt-3">Micro-site Not Found</h1>
              <p class="text-sm text-slate-400 mt-2 font-medium">
                Micro-site not found or currently inactive.
              </p>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
              The requested business micro-site does not exist or has not been deployed yet via the QuoteCall AI mobile application.
            </p>
            <a
              href="/"
              class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs border border-slate-700 transition-all shadow-md"
            >
              <i data-lucide="home" class="w-4 h-4"></i>
              <span>Return to Home</span>
            </a>
          </div>
        );
      }

      return (
        <div class="space-y-6">
          
          {/* Header Banner */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute -top-12 -right-12 w-32 h-32 rounded-full opacity-20 blur-2xl" style={{ backgroundColor: config.themeColorHex }}></div>
            
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 mb-3 shadow-inner overflow-hidden">
              <img src={config.logoUrl} alt="Logo" class="w-full h-full object-cover" />
            </div>

            <h1 class="text-2xl md:text-3xl font-black tracking-tight text-white uppercase">{config.siteTitle}</h1>
            <p class="text-xs md:text-sm text-slate-400 mt-1 font-medium">{config.siteSubtitle}</p>
            
            <div class="inline-flex items-center gap-2 mt-3 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-[11px] font-semibold text-cyan-400">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              24/7 AI Service Agent Active
            </div>
          </div>

          {/* Section: Uber-style Visual Progress Timeline */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i>
                Dispatch Tracking Status
              </h3>
              <span class={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full border ${
                dispatchStage === 3 ? 'bg-emerald-950 text-emerald-400 border-emerald-800' :
                dispatchStage === 2 ? 'bg-cyan-950 text-cyan-400 border-cyan-800 animate-pulse' :
                dispatchStage === 1 ? 'bg-amber-950 text-amber-400 border-amber-800' :
                'bg-slate-800 text-slate-400 border-slate-700'
              }`}>
                {dispatchStage === 3 ? 'Arrived' : dispatchStage === 2 ? 'En Route' : dispatchStage === 1 ? 'Driver Assigned' : 'Requested'}
              </span>
            </div>

            {/* Horizontal 4-Stage Stepper */}
            <div class="relative pt-2 pb-1">
              {/* Connector Bar Background */}
              <div class="absolute top-6 left-6 right-6 h-1 bg-slate-800 rounded-full z-0"></div>
              {/* Filled Active Connector Bar */}
              <div
                class="absolute top-6 left-6 h-1 bg-gradient-to-r from-cyan-500 to-emerald-400 rounded-full transition-all duration-500 z-0"
                style={{ width: `${(dispatchStage / 3) * 88}%` }}
              ></div>

              <div class="relative z-10 grid grid-cols-4 gap-1 text-center">
                {/* Stage 0: Requested */}
                <button
                  onClick={() => setDispatchStage(0)}
                  class="flex flex-col items-center gap-1.5 focus:outline-none group"
                >
                  <div class={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${
                    dispatchStage >= 0
                      ? 'bg-cyan-500 text-slate-950 font-bold shadow-lg shadow-cyan-500/20'
                      : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}>
                    <i data-lucide="bell" class="w-4 h-4"></i>
                  </div>
                  <span class={`text-[10px] font-bold ${dispatchStage >= 0 ? 'text-cyan-400' : 'text-slate-500'}`}>Requested</span>
                </button>

                {/* Stage 1: Driver Assigned */}
                <button
                  onClick={() => setDispatchStage(1)}
                  class="flex flex-col items-center gap-1.5 focus:outline-none group"
                >
                  <div class={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${
                    dispatchStage >= 1
                      ? 'bg-cyan-500 text-slate-950 font-bold shadow-lg shadow-cyan-500/20'
                      : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}>
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                  </div>
                  <span class={`text-[10px] font-bold ${dispatchStage >= 1 ? 'text-cyan-400' : 'text-slate-500'}`}>Assigned</span>
                </button>

                {/* Stage 2: En Route */}
                <button
                  onClick={() => setDispatchStage(2)}
                  class="flex flex-col items-center gap-1.5 focus:outline-none group"
                >
                  <div class={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${
                    dispatchStage >= 2
                      ? 'bg-cyan-500 text-slate-950 font-bold shadow-lg shadow-cyan-500/20 animate-bounce'
                      : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}>
                    <i data-lucide="navigation" class="w-4 h-4"></i>
                  </div>
                  <span class={`text-[10px] font-bold ${dispatchStage >= 2 ? 'text-cyan-400' : 'text-slate-500'}`}>En Route</span>
                </button>

                {/* Stage 3: Arrived */}
                <button
                  onClick={() => setDispatchStage(3)}
                  class="flex flex-col items-center gap-1.5 focus:outline-none group"
                >
                  <div class={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${
                    dispatchStage >= 3
                      ? 'bg-emerald-400 text-slate-950 font-bold shadow-lg shadow-emerald-400/30'
                      : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}>
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                  </div>
                  <span class={`text-[10px] font-bold ${dispatchStage >= 3 ? 'text-emerald-400' : 'text-slate-500'}`}>Arrived</span>
                </button>
              </div>
            </div>

            <div class="p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-300 flex items-center gap-2">
              <i data-lucide="info" class="w-4 h-4 text-cyan-400 flex-shrink-0"></i>
              <span>
                {dispatchStage === 0 && "Job requested — Start voice call or upload details to assign unit."}
                {dispatchStage === 1 && `Technician assigned for ${config.companyName}. Confirm deposit to launch unit.`}
                {dispatchStage === 2 && "Dispatch Unit #402 is en route to your location with GPS tracking."}
                {dispatchStage === 3 && "Technician arrived on site! Service in progress."}
              </span>
            </div>
          </div>

          {/* SMS Confirmation Notification Alert */}
          {smsNotification && (
            <div class="bg-gradient-to-r from-emerald-950/90 to-slate-900 border border-emerald-500/50 rounded-3xl p-5 shadow-2xl text-left space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-emerald-400">
                  <i data-lucide="message-square" class="w-4 h-4"></i>
                  <span>SMS Dispatch Confirmation Sent</span>
                </div>
                <span class="text-[10px] font-mono text-slate-400">{smsNotification.timestamp}</span>
              </div>
              <div class="bg-slate-950/90 p-3.5 rounded-2xl border border-slate-800 text-xs font-mono text-emerald-300 leading-relaxed space-y-1">
                <div class="text-[10px] text-slate-500 flex justify-between">
                  <span>TO: {smsNotification.phone}</span>
                  <span>ID: {smsNotification.trackingId}</span>
                </div>
                <p class="pt-1">{smsNotification.message}</p>
              </div>
            </div>
          )}

          {/* Section 1: Instant AI Dispatch / Live Voice Button */}
          <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-6 shadow-xl text-center space-y-4">
            <div>
              <h2 class="text-lg font-bold text-white flex items-center justify-center gap-2">
                <i data-lucide="mic" class="w-5 h-5 text-cyan-400"></i>
                {config.voiceCallButtonText}
              </h2>
              <p class="text-xs text-slate-400 mt-1">{config.voiceCallDescription}</p>
            </div>

            {/* Big Glowing Call Button */}
            <button
              onClick={toggleGeminiLiveCall}
              style={{ backgroundColor: isLiveConnected ? '#EF4444' : config.themeColorHex }}
              class={`w-full py-4 px-6 rounded-2xl text-slate-950 font-black text-base flex items-center justify-center gap-3 shadow-lg transition-all transform active:scale-95 ${!isLiveConnected ? 'animate-pulse-glow' : ''}`}
            >
              {isLiveConnected ? (
                <>
                  <i data-lucide="phone-off" class="w-6 h-6 text-white"></i>
                  <span class="text-white">End AI Voice Call</span>
                </>
              ) : (
                <>
                  <i data-lucide="phone-call" class="w-6 h-6"></i>
                  <span>Start Live AI Voice Call</span>
                </>
              )}
            </button>

            {/* Live Audio Status Indicator */}
            {isLiveConnected && (
              <div class="p-4 rounded-2xl bg-slate-900/90 border border-cyan-500/30 text-left space-y-2">
                <div class="flex items-center justify-between text-xs font-semibold text-cyan-400">
                  <span class="flex items-center gap-2">
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    <span class="voice-wave"></span>
                    {voiceStatus}
                  </span>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-cyan-300 bg-cyan-950/80 border border-cyan-800/60 px-2 py-0.5 rounded-lg text-xs font-bold">
                      {formatCallDuration(callDuration)}
                    </span>
                    <span class="text-[10px] text-slate-500 uppercase">Gemini 2.0 Live API</span>
                  </div>
                </div>
                {aiResponseText && (
                  <p class="text-xs text-slate-200 bg-slate-950/80 p-3 rounded-xl border border-slate-800 italic">
                    {aiResponseText}
                  </p>
                )}
                {/* Transcript Box */}
                <div class="mt-2 text-xs text-slate-300 bg-slate-950/60 p-3 rounded-xl border border-slate-800 max-h-32 overflow-y-auto">
                  <p class="font-bold text-slate-500 mb-1">Live Transcript:</p>
                  {transcript.length === 0 ? (
                    <span class="italic text-slate-600">Waiting for audio...</span>
                  ) : (
                    transcript.map((line, i) => <p key={i}>{line}</p>)
                  )}
                </div>
              </div>
            )}
          </div>

          {/* Section 2: Problem Description & Photo Upload */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
            <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
              <i data-lucide="camera" class="w-4 h-4 text-cyan-400"></i>
              Describe Issue or Upload Photo
            </h3>

            <textarea
              value={issueText}
              onChange={(e) => setIssueText(e.target.value)}
              placeholder="e.g. Flat tire on HWY 101 north, need tow truck or tire change..."
              class="w-full h-24 p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-all resize-none"
            ></textarea>

            {/* Photo Upload Area */}
            <div class="flex items-center gap-4">
              <label class="flex-1 cursor-pointer flex items-center justify-center gap-2 p-3 bg-slate-950 border border-dashed border-slate-700 rounded-2xl text-xs text-slate-400 hover:border-cyan-400 hover:text-cyan-400 transition-all">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span class="truncate">{selectedPhoto ? selectedPhoto.name : "Attach Photo of Damage"}</span>
                <input type="file" accept="image/*" onChange={handleImageUpload} class="hidden" />
              </label>

              {photoPreview && (
                <div class="flex items-center gap-2">
                  <div class="w-12 h-12 rounded-xl overflow-hidden border border-cyan-500/50 flex-shrink-0 relative">
                    <img src={photoPreview} alt="Preview" class="w-full h-full object-cover" />
                  </div>
                  <button
                    onClick={removePhoto}
                    title="Remove Photo"
                    class="p-2 rounded-xl bg-slate-950 border border-red-500/40 text-red-400 hover:bg-red-950/40 transition-all text-xs"
                  >
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Section 3: Live GPS Location Sharing (Field Dispatch) */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-cyan-400"></i>
                Live GPS Location Dispatch
              </h3>
              {gpsLocation && (
                <span class="text-[10px] font-extrabold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2.5 py-1 rounded-full flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  GPS Acquired
                </span>
              )}
            </div>

            <p class="text-xs text-slate-400 leading-relaxed">
              Share your precise breakdown or job coordinates so the responding technician or driver can navigate directly to your location.
            </p>

            <button
              onClick={requestGpsLocation}
              disabled={isGettingGps}
              class="w-full py-3 px-4 rounded-2xl bg-slate-950 border border-slate-700 hover:border-cyan-400 text-cyan-400 hover:text-white font-bold text-xs flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50"
            >
              {isGettingGps ? (
                <>
                  <div class="w-4 h-4 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                  <span>Acquiring GPS Signal...</span>
                </>
              ) : (
                <>
                  <i data-lucide="crosshair" class="w-4 h-4"></i>
                  <span>{gpsLocation ? "Update Live GPS Location" : "Share My Live Location"}</span>
                </>
              )}
            </button>

            {gpsStatusMessage && (
              <p class={`text-xs p-2.5 rounded-xl text-center font-medium ${gpsLocation ? 'bg-emerald-950/30 text-emerald-400 border border-emerald-800/40' : 'bg-amber-950/30 text-amber-400 border border-amber-800/40'}`}>
                {gpsStatusMessage}
              </p>
            )}

            {gpsLocation && (
              <div class="p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 space-y-3">
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-[10px] text-slate-500 uppercase font-semibold block">Latitude</span>
                    <span class="font-mono text-cyan-400 font-bold">{gpsLocation.latitude}</span>
                  </div>
                  <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-[10px] text-slate-500 uppercase font-semibold block">Longitude</span>
                    <span class="font-mono text-cyan-400 font-bold">{gpsLocation.longitude}</span>
                  </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 pt-1 flex-wrap gap-2">
                  <span>Accuracy: ~{gpsLocation.accuracy}m</span>
                  <div class="flex items-center gap-2">
                    <button
                      onClick={handleCopyGpsLink}
                      class={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border font-bold text-xs transition-all ${
                        copiedGpsLink
                          ? 'bg-emerald-950/80 border-emerald-500 text-emerald-400'
                          : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-cyan-400 hover:text-cyan-400'
                      }`}
                    >
                      <i data-lucide={copiedGpsLink ? "check" : "copy"} class="w-3.5 h-3.5"></i>
                      <span>{copiedGpsLink ? "Copied!" : "Copy Link"}</span>
                    </button>
                    <a
                      href={gpsLocation.mapsUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs hover:bg-cyan-400 transition-all shadow"
                    >
                      <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                      <span>Open Google Maps Pin</span>
                    </a>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Section 4: Deposit Payment Section (Stripe Checkout) */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl text-center space-y-4">
            <div class="flex items-center justify-between">
              <div class="text-left">
                <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">Required Security Deposit</span>
                <p class="text-2xl font-black text-white">${config.quickDepositFee.toFixed(2)} USD</p>
              </div>
              <div class="flex items-center gap-1 text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800/40 px-3 py-1.5 rounded-xl">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Stripe Secured</span>
              </div>
            </div>

            {/* Stripe Quick Deposit Button */}
            <button
              onClick={handleDirectDeposit}
              disabled={isProcessingStripe}
              class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 disabled:opacity-50"
            >
              {isProcessingStripe ? (
                <span>Generating Stripe Link...</span>
              ) : (
                <>
                  <i data-lucide="credit-card" class="w-5 h-5"></i>
                  <span>Quick Deposit ${config.quickDepositFee.toFixed(2)} via Stripe</span>
                </>
              )}
            </button>

            {/* Generated Stripe Link from Gemini Function Call */}
            {depositLink && (
              <div class="p-4 rounded-2xl bg-emerald-950/30 border border-emerald-500/50 text-left space-y-2 animate-bounce">
                <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
                  <span>AI Generated Stripe Deposit Link</span>
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                </div>
                <a
                  href={depositLink}
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full py-2.5 bg-emerald-500 text-slate-950 font-black text-xs text-center rounded-xl shadow hover:bg-emerald-400 transition-all"
                >
                  Pay ${config.quickDepositFee.toFixed(2)} Deposit Now & Launch Tow Truck
                </a>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer class="text-center pt-4 pb-8 space-y-1">
            <p class="text-[11px] text-slate-500 font-medium">Powered by QuoteCall AI & Firebase Hosting</p>
            <p class="text-[10px] text-slate-600">Instant Field Dispatch • Multimodal Voice Intelligence</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Initialize Lucide Icons after render
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 500);
  </script>
</body>
</html>
