    // React Error Boundary to prevent black screen crashes
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("App Error Caught by Boundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div class="p-6 bg-slate-900 border border-red-500/50 rounded-3xl text-center space-y-4 my-8">
              <h2 class="text-lg font-bold text-red-400">Assistant Encountered a Temporary Error</h2>
              <p class="text-xs text-slate-300">The page remained visible and protected from crashing. Click below to reload the assistant.</p>
              <button 
                onClick={() => this.setState({ hasError: false })}
                class="px-5 py-2.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl shadow hover:bg-cyan-400"
              >
                Reload Assistant UI
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

                  class={`w-full py-4 px-6 rounded-2xl text-slate-950 font-black text-base flex items-center justify-center gap-3 shadow-lg transition-all transform active:scale-95 ${!isLiveConnected ? 'animate-pulse-glow' : ''}`}
                >
                  {isLiveConnected ? (
                    <>
                      <Icon name="phone-off" className="w-5 h-5 text-white" />
                      <span class="text-white">End Voice Call</span>
                    </>
                  ) : (
                    <>
                      <Icon name="phone-call" className="w-5 h-5" />
                      <span>Start AI Voice Call</span>
                    </>
                  )}
                </button>

                <div class="w-full space-y-3 min-h-[260px] flex flex-col justify-start">
                  {isLiveConnected ? (
                    <div class="p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 text-left space-y-3 min-h-[220px] shadow-lg animate-fade-in">
                      <div class="flex items-center justify-between text-xs font-semibold text-cyan-400">
                        <span class="flex items-center gap-2">
                          <span class="voice-wave"></span>
                          <span class="voice-wave"></span>
                          <span class="voice-wave"></span>
                          {voiceStatus}
                        </span>
                        <span class="font-mono text-cyan-300 bg-cyan-950/80 border border-cyan-800 px-2 py-0.5 rounded-lg text-xs font-bold">
                          {formatCallDuration(callDuration)}
                        </span>
                      </div>

                      {/* Real-time animated audio input level bar */}
                      <div class="space-y-1">
                        <div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">
                          <span>MIC INPUT LEVEL (CONFIRMED)</span>
                          <span class="text-cyan-400">ACTIVE</span>
                        </div>
                        <div class="flex items-center justify-center gap-1.5 h-6 bg-slate-900 px-3 rounded-lg border border-slate-800">
                          {(audioLevels || [20, 40, 60, 30, 50]).map((lvl, idx) => (
                            <div key={idx} class="flex-1 bg-cyan-400 rounded-full transition-all duration-150" style={{ height: `${lvl}%` }}></div>
                          ))}
                        </div>
                      </div>

                      {aiResponseText && (
                        <p class="text-xs text-slate-200 bg-slate-900 p-3 rounded-xl border border-slate-800 italic">
                          {aiResponseText}
                        </p>
                      )}

                      {/* Quick Voice Prompt Chips */}
                      <div class="space-y-1.5 pt-1">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Quick Voice Prompts (Tap or Speak):</p>
                        <div class="flex flex-wrap gap-1.5">
                          <button onClick={() => handleQuickVoicePrompt("I need Starlink Roof Mount installation")} class="text-[11px] bg-slate-900 border border-slate-700 hover:border-cyan-400 text-cyan-300 px-2.5 py-1 rounded-lg transition-all">
                            Roof Mount ($200)
                          </button>
                          <button onClick={() => handleQuickVoicePrompt("I need custom cable routing through walls")} class="text-[11px] bg-slate-900 border border-slate-700 hover:border-cyan-400 text-cyan-300 px-2.5 py-1 rounded-lg transition-all">
                            Cable Routing ($75)
                          </button>
                          <button onClick={() => handleQuickVoicePrompt("I want to book an appointment with $50 deposit")} class="text-[11px] bg-slate-900 border border-slate-700 hover:border-cyan-400 text-cyan-300 px-2.5 py-1 rounded-lg transition-all">
                            Book Deposit ($50)
                          </button>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div class="space-y-3">
                      {voiceStatus !== "Disconnected" && (
                        <div class="p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-cyan-400 font-mono text-center">
                          {voiceStatus}
                        </div>
                      )}

                      {/* Transcript Download Button */}
                      {transcript && transcript.length > 0 && (
                        <button
                          onClick={downloadTranscript}
                          class="w-full py-2.5 px-4 rounded-xl bg-slate-950 border border-slate-700 text-cyan-400 text-xs font-bold flex items-center justify-center gap-2 hover:bg-slate-800 transition-all shadow"
                        >
                          <Icon name="download" className="w-4 h-4" />
                          <span>Download Call Transcript (.txt)</span>
                        </button>
                      )}

                      {/* Post-Call Summary Component */}
                      {showPostCallSummary && (
                        <div class="bg-slate-950 border border-cyan-500/50 rounded-2xl p-4 text-left space-y-3 shadow-2xl animate-fade-in">
                          <div class="flex items-center justify-between">
                            <h4 class="text-xs font-bold text-cyan-400 uppercase flex items-center gap-2">
                              <Icon name="check-circle" className="w-4 h-4 text-cyan-400" />
                              Post-Call Installation Summary
                            </h4>
                            <span class="text-[10px] font-mono bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-800">
                              Duration: {formatCallDuration(callDuration)}
                            </span>
                          </div>
                          <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1 text-xs text-slate-300">
                            <p><strong class="text-white">Scope:</strong> Starlink Roof Mount & Cable Routing</p>
                            <p><strong class="text-white">Estimated Total:</strong> $275.00</p>
                            <p><strong class="text-white">Deposit Required:</strong> ${formatMoney(config.quickDepositFee)}</p>
                          </div>
                          <button
                            onClick={handleDirectDeposit}
                            class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-400 to-teal-400 text-slate-950 font-black text-xs flex items-center justify-center gap-2 shadow-lg"
                          >
                            <Icon name="credit-card" className="w-4 h-4" />
                            <span>Confirm Booking & Pay ${formatMoney(config.quickDepositFee)} Deposit</span>
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 2: Interactive Text Chat Fallback */}
            {activeTab === 'chat' && (
              <div class="space-y-3">
                <div class="h-56 overflow-y-auto bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2 text-xs">
                  {chatMessages.map((msg, i) => (
                    <div key={i} class={`flex ${msg.sender === 'User' ? 'justify-end' : 'justify-start'}`}>
                      <div class={`max-w-[80%] p-2.5 rounded-xl ${
                        msg.sender === 'User' ? 'bg-cyan-500 text-slate-950 font-medium' : 'bg-slate-900 text-slate-200 border border-slate-800'
                      }`}>
                        <p class="text-[10px] opacity-70 font-bold mb-0.5">{msg.sender}</p>
                        <p>{msg.text}</p>
                      </div>
                    </div>
                  ))}
                  {isAiTyping && (
                    <div class="flex justify-start">
                      <div class="bg-slate-900 text-slate-400 p-2 rounded-xl border border-slate-800 italic text-[11px]">
                        Skynet One AI is typing...
                      </div>
                    </div>
                  )}
                </div>

                <form onSubmit={handleSendChatMessage} class="flex gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask about roof mount, pricing ($200/$75), or booking..."
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                  />
                  <button
                    type="submit"
                    class="px-4 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition-all"
                  >
                    Send
                  </button>
                </form>
              </div>
            )}
          </div>

          {/* Section: Installation Site Description & Photo Upload */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
            <h3 class="text-xs font-bold text-slate-200 flex items-center gap-2">
              <Icon name="camera" className="w-4 h-4 text-cyan-400" />
              Describe Site or Attach Roof/Wall Photo
            </h3>

            <textarea
              value={issueText}
              onChange={(e) => setIssueText(e.target.value)}
              placeholder="Describe your Starlink installation, roof mount, obstruction check, or custom networking setup needs..."
              class="w-full h-20 p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-all resize-none"
            ></textarea>

            <div class="flex items-center gap-3">
              <label class="flex-1 cursor-pointer flex items-center justify-center gap-2 p-3 bg-slate-950 border border-dashed border-slate-700 rounded-2xl text-xs text-slate-400 hover:border-cyan-400 hover:text-cyan-400 transition-all">
                <Icon name="upload-cloud" className="w-4 h-4" />
                <span class="truncate">{selectedPhoto ? selectedPhoto.name : "Attach Photo of Installation Site or Roof"}</span>
                <input type="file" accept="image/*" onChange={handleImageUpload} class="hidden" />
              </label>

              {photoPreview && (
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-cyan-500 relative flex-shrink-0">
                  <img src={photoPreview} alt="Roof Preview" class="w-full h-full object-cover" />
                </div>
              )}
            </div>
          </div>

          {/* Section: Installation Site Live GPS Location */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-200 flex items-center gap-2">
                <Icon name="map-pin" className="w-4 h-4 text-cyan-400" />
                Installation Address GPS Pin
              </h3>
              {gpsLocation && (
                <span class="text-[10px] font-extrabold text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded-full">
                  GPS Pin Set
                </span>
              )}
            </div>

            <button
              onClick={requestGpsLocation}
              disabled={isGettingGps}
              class="w-full py-2.5 px-4 rounded-xl bg-slate-950 border border-slate-700 hover:border-cyan-400 text-cyan-400 font-bold text-xs flex items-center justify-center gap-2 transition-all"
            >
              {isGettingGps ? (
                <span>Fetching Coordinates...</span>
              ) : (
                <>
                  <Icon name="crosshair" className="w-4 h-4" />
                  <span>{gpsLocation ? "Update GPS Location" : "Share Installation GPS Location"}</span>
                </>
              )}
            </button>

            {gpsStatusMessage && (
              <p class="text-[11px] text-center font-medium text-slate-400">{gpsStatusMessage}</p>
            )}
          </div>

          {/* Section: Stripe Security Deposit Booking */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl text-center space-y-3">
            <div class="flex items-center justify-between">
              <div class="text-left">
                <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">Security Booking Deposit</span>
                <p class="text-xl font-black text-white">${formatMoney(config.quickDepositFee)} USD</p>
              </div>
              <div class="flex items-center gap-1 text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800 px-2.5 py-1 rounded-xl">
                <Icon name="shield-check" className="w-4 h-4" />
                <span>Stripe Secured</span>
              </div>
            </div>

            <button
              onClick={handleDirectDeposit}
              disabled={isProcessingStripe}
              class="w-full py-3 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 disabled:opacity-50"
            >
              {isProcessingStripe ? (
                <span>Generating Stripe Link...</span>
              ) : (
                <>
                  <Icon name="credit-card" className="w-4 h-4" />
                  <span>Book Slot with $50 Deposit via Stripe</span>
                </>
              )}
            </button>

            {depositLink && (
              <div class="p-3 rounded-2xl bg-emerald-950/40 border border-emerald-500/50 text-left space-y-2">
                <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
                  <span>AI Generated Stripe Deposit Link</span>
                  <Icon name="external-link" className="w-4 h-4" />
                </div>
                <a
                  href={depositLink}
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full py-2 bg-emerald-500 text-slate-950 font-black text-xs text-center rounded-xl shadow hover:bg-emerald-400 transition-all"
                >
                  Pay $50 Deposit Now to Confirm Starlink Tech
                </a>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer class="text-center pt-3 pb-6 space-y-1">
            <p class="text-[11px] text-slate-500 font-medium">Powered by Skynet One & QuoteBit Engine</p>
            <p class="text-[10px] text-slate-600">Certified Starlink Field Installation • AI Voice & Text Dispatch</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
